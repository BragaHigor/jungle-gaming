name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  validation:
    name: Validacao
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: canopy_test
          POSTGRES_PASSWORD: canopy_test
          POSTGRES_DB: canopy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canopy_test -d canopy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Obter o codigo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configurar Node.js e cache npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configurar a versao do npm
        run: npm install --global npm@11.6.0

      - name: Instalar dependencias pelo lockfile
        run: npm ci

      - name: Validar codigo testes e build
        run: npm run check

      - name: Validar transacoes em PostgreSQL isolado
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://canopy_test:canopy_test@localhost:5432/canopy_test

  deploy:
    name: Deploy Vercel
    needs: validation
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.ref_name == 'main' && 'prd' || 'hml' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TARGET: ${{ github.ref_name == 'main' && 'production' || 'preview' }}

    steps:
      - name: Obter o mesmo commit validado
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Conferir configuracao do ambiente
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_ORG_ID" || { echo "Configure VERCEL_ORG_ID no ambiente GitHub."; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Configure VERCEL_PROJECT_ID no ambiente GitHub."; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo "Configure o secret VERCEL_TOKEN no ambiente GitHub."; exit 1; }

      - name: Instalar Vercel CLI com versao fixa
        run: npm install --global vercel@64.5.0

      - name: Publicar o codigo validado
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          flags=()
          if [[ "$VERCEL_TARGET" == "production" ]]; then
            flags+=(--skip-domain)
          fi
          url=$(vercel deploy --yes --target "$VERCEL_TARGET" \
            --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" "${flags[@]}" \
            --token "$VERCEL_TOKEN" \
            --meta githubDeployment=1 \
            --meta "githubCommitRef=$GITHUB_REF_NAME" \
            --meta "githubCommitSha=$GITHUB_SHA")
          [[ "$url" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app$ ]] || { echo "URL de deploy inesperada."; exit 1; }
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
          printf '### Deploy Vercel\n\nCommit: `%s`\n\nAmbiente: `%s`\n\nURL: %s\n' \
            "$GITHUB_SHA" "$VERCEL_TARGET" "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Conferir os dois servicos por HTTPS
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for path in /api/health /api/realtime/health; do
            response=$(vercel --scope "$VERCEL_ORG_ID" curl "$path" --deployment "$DEPLOYMENT_URL" \
              -- --fail --silent --show-error --max-time 30 --retry 2)
            printf '%s' "$response" | node -e 'if (JSON.parse(require("node:fs").readFileSync(0, "utf8")).status !== "ok") process.exit(1)'
          done

      - name: Conferir paginas publicas antes da promocao
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for path in / /play /project /system /showcase; do
            response=$(vercel --scope "$VERCEL_ORG_ID" curl "$path" --deployment "$DEPLOYMENT_URL" \
              -- --fail --silent --show-error --max-time 30 --retry 2)
            printf '%s' "$response" | node -e 'if (!/<title>[^<]*Lucky Canopy[^<]*<\/title>/i.test(require("node:fs").readFileSync(0, "utf8"))) process.exit(1)'
          done

      - name: Promover producao depois das verificacoes
        if: env.VERCEL_TARGET == 'production'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: vercel promote "$DEPLOYMENT_URL" --yes --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"
